# Obol Centaur — Slack app manifest
#
# api.slack.com/apps → Create New App → From an app manifest → paste this
# Install to Obol workspace → copy Bot Token + Signing Secret → centaur/.env
#
# While testing on laptop:
#   Terminal A: kubectl port-forward -n centaur svc/centaur-centaur-slackbot 3001:3001
#   Terminal B: ngrok http 3001
#
# Webhook path: /api/webhooks/slack (NOT /slack/events like obol-coworker)
# Separate app from @obol-coworker.

display_information:
  name: Obol Centaur
  description: "Centaur agent for Launchpad PRs and coding tasks."
  background_color: "#1D4ED8"

features:
  bot_user:
    display_name: obol-centaur
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
      - reactions:read
      - reactions:write
      - users:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  is_hosted: false
  token_rotation_enabled: false
  event_subscriptions:
    request_url: https://ngrokurl/api/webhooks/slack
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://sleek-underwire-stylishly.ngrok-free.dev/api/slack/actions
